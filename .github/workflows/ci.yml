name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "web3>=6,<7" redis python-dotenv flask
      - name: Byte-compile sources
        run: python -m compileall -q backend frontend
      - name: Import the Flask app
        run: cd frontend && python -c "import app"
